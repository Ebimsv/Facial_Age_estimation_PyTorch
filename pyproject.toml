[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-age-estimation"
version = "0.2.0"
description = "Facial age estimation using deep learning — EfficientNet-B3, ResNet-50, ViT-S/DINOv2 on UTKFace"
readme = "Readme.md"
license = { file = "LICENSE" }
authors = [{ name = "Ebi Mousavi", email = "ebimsv0501@gmail.com" }]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "timm>=0.9.0",
    "Pillow>=9.0.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "numpy>=1.23.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.14.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0.0", "huggingface-hub>=0.19.0"]
wandb = ["wandb>=0.15.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Ebimsv/Facial_Age_estimation_PyTorch"
Issues   = "https://github.com/Ebimsv/Facial_Age_estimation_PyTorch/issues"

[project.scripts]
train-age  = "scripts.train:main"
eval-age   = "scripts.evaluate:main"
export-age = "scripts.export_model:main"

[tool.setuptools.packages.find]
where     = ["."]
include   = ["src", "src.*", "scripts", "demo"]
namespaces = false

[tool.setuptools.package-data]
"src.configs" = ["default.yaml"]

# ── Ruff (linting + formatting) ──────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
    "N812",  # lowercase imported as non-lowercase
]

[tool.ruff.lint.isort]
# Tell ruff/isort that 'src' is our own first-party code.
# Without this, CI (a fresh machine with no installed packages) cannot auto-detect
# src as local code and may mis-classify 'from src.*' as third-party, causing
# I001 import-ordering errors that don't reproduce locally.
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*"   = ["S101"]           # assert is fine in tests
"scripts/*" = ["E402"]           # sys.path manipulation must precede project imports
"demo/*"    = ["E402", "W291"]   # same; W291 comes from multi-line Gradio markdown strings

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths       = ["tests"]
addopts         = "-v --tb=short"
filterwarnings  = ["ignore::DeprecationWarning", "ignore::UserWarning"]
