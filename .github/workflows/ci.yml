name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel older runs for the same branch when a newer push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ───────────────────────────────────────────────────────────
  lint:
    name: "Lint — ruff"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.16.3"   # pin version to match local dev

      - name: Run ruff check
        run: ruff check src/ scripts/ demo/ tests/

  # ── Job 2: Unit Tests (CPU only, no GPU required) ─────────────────────────
  test:
    name: "Tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: lint           # only run tests when lint passes
    strategy:
      fail-fast: false    # run ALL matrix jobs even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install CPU-only PyTorch
        run: |
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu \
            --quiet

      - name: Install project runtime dependencies
        run: |
          pip install \
            timm \
            omegaconf \
            tqdm \
            scikit-learn \
            "pandas>=1.5" \
            "Pillow>=9.0" \
            "numpy>=1.23" \
            matplotlib \
            seaborn \
            --quiet

      - name: Install test dependencies
        run: pip install pytest pytest-cov build "setuptools>=68" wheel tensorboard --quiet

      - name: Print environment info
        run: |
          python -c "
          import sys, torch, torchvision, timm, omegaconf, PIL, pandas, numpy
          print(f'Python     : {sys.version}')
          print(f'PyTorch    : {torch.__version__}')
          print(f'torchvision: {torchvision.__version__}')
          print(f'timm       : {timm.__version__}')
          print(f'omegaconf  : {omegaconf.__version__}')
          print(f'Pillow     : {PIL.__version__}')
          print(f'pandas     : {pandas.__version__}')
          print(f'numpy      : {numpy.__version__}')
          print(f'CUDA avail : {torch.cuda.is_available()}')
          "

      - name: Run model, loss, and transform tests
        run: |
          pytest tests/test_model.py tests/test_losses.py tests/test_transforms.py \
            -v --tb=short \
            -k "not vit_small"

      - name: Run dataset tests (synthetic data — no real dataset needed)
        run: |
          pytest tests/test_dataset.py tests/test_prepare_data.py tests/test_reproducibility.py tests/test_download_data.py tests/test_download_huggingface.py -v --tb=short

      - name: Validate configuration and preparation contracts (offline)
        run: pytest tests/test_config.py -v --tb=short

      - name: Checkpoint and inference compatibility (offline)
        run: pytest tests/test_checkpoint.py tests/test_inference.py -v --tb=short

      - name: Build and test installed distributions (no downloads)
        run: pytest tests/test_packaging.py -v --tb=short
